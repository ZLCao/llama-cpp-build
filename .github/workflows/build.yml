name: Build llama.cpp Windows CUDA

on:
  workflow_dispatch:
    inputs:
      cuda_arch:
        description: 'CUDA 架构 (RTX 5060 Ti = 120, RTX 4090 = 89, RTX 3090 = 86)'
        required: false
        default: '120'
      llama_cpp_ref:
        description: 'llama.cpp 分支/tag/commit'
        required: false
        default: 'b9233'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows-cuda:
    runs-on: windows-2022
    steps:
      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ github.event.inputs.llama_cpp_ref }}
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # 👇 缓存 1：CUDA Toolkit 12.9.1
      - name: Cache CUDA Toolkit
        uses: actions/cache@v4
        id: cache-cuda
        with:
          path: C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.9
          key: cuda-12.9.1-windows2022-${{ runner.os }}
          restore-keys: |
            cuda-12.9.1-windows2022-

      - name: Setup CUDA Toolkit
        if: steps.cache-cuda.outputs.cache-hit != 'true'
        uses: mjun0812/setup-cuda@v1
        with:
          version: '12.9.1'
          method: 'local'

      # 👇 动态下载并静默安装 OpenSSL 3 Light
      - name: Install OpenSSL 3 (Light)
        shell: pwsh
        run: |
          # 从 Shining Light 官方哈希表动态获取最新 Win64 OpenSSL 3 Light 安装包 URL
          $json = (Invoke-WebRequest "https://raw.githubusercontent.com/slproweb/opensslhashes/master/win32_openssl_hashes.json" -UseBasicParsing).Content
          $data = $json | ConvertFrom-Json
          $entry = $data.files.PSObject.Properties | Where-Object { $_.Name -match "Win64OpenSSL-Light-.*\.exe$" } | Select-Object -Last 1
          $url = $entry.Value.url
          if (-not $url) {
            # fallback：硬编码已知可用 URL
            $url = "https://slproweb.com/download/Win64OpenSSL-Light-3_5_2.exe"
          }
          Write-Host "Downloading OpenSSL from: $url"
          Invoke-WebRequest -OutFile Win64OpenSSL-Light.exe $url -UseBasicParsing
          Start-Process -FilePath ".\Win64OpenSSL-Light.exe" -ArgumentList "/silent","/sp-","/suppressmsgboxes","/DIR=C:\OpenSSL-Win64" -Wait
          
          # 验证 DLL 存在
          if (Test-Path "C:\OpenSSL-Win64\bin\libssl-3-x64.dll") {
            Write-Host "✅ OpenSSL 3 DLLs installed successfully"
            Get-ChildItem "C:\OpenSSL-Win64\bin\" -Filter "*.dll" | Select-Object Name
          } else {
            Write-Error "❌ OpenSSL DLLs not found after installation"
            exit 1
          }

      # 👇 缓存 2：build 目录（编译产物）
      - name: Cache build directory
        uses: actions/cache@v4
        id: cache-build
        with:
          path: build
          key: build-${{ github.event.inputs.llama_cpp_ref }}-cuda${{ github.event.inputs.cuda_arch }}-${{ runner.os }}-${{ hashFiles('llama.cpp/CMakeLists.txt', 'llama.cpp/ggml/src/ggml-cuda/CMakeLists.txt') }}
          restore-keys: |
            build-${{ github.event.inputs.llama_cpp_ref }}-cuda${{ github.event.inputs.cuda_arch }}-${{ runner.os }}-

      - name: Fix CUDA VS Integration
        shell: pwsh
        run: |
          $cudaPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.9"
          $vsBuildCustomizations = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Microsoft\VC\v170\BuildCustomizations"
          Copy-Item "$cudaPath\extras\visual_studio_integration\MSBuildExtensions\*" -Destination $vsBuildCustomizations -Force
          Write-Host "CUDA MSBuild extensions copied"

      - name: Verify environment
        shell: cmd
        run: |
          echo === nvcc ===
          nvcc --version
          echo === CUDA_PATH ===
          echo %CUDA_PATH%
          echo === cache hit ===
          echo cuda=%CUDA_HIT%  build=%BUILD_HIT%
        env:
          CUDA_HIT: ${{ steps.cache-cuda.outputs.cache-hit }}
          BUILD_HIT: ${{ steps.cache-build.outputs.cache-hit }}

      - name: CMake configure
        shell: cmd
        run: |
          cmake -B build ^
            -G "Visual Studio 17 2022" ^
            -A x64 ^
            -DGGML_CUDA=ON ^
            -DCMAKE_CUDA_ARCHITECTURES=${{ github.event.inputs.cuda_arch }} ^
            -DCMAKE_CUDA_COMPILER="C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.9\bin\nvcc.exe" ^
            -DCMAKE_GENERATOR_TOOLSET="cuda=C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.9" ^
            -DCUDA_TOOLKIT_ROOT_DIR="C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.9" ^
            -DLLAMA_BUILD_SERVER=ON ^
            -DLLAMA_BUILD_EXAMPLES=ON ^
            -DLLAMA_BUILD_TESTS=OFF ^
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: cmd
        run: |
          cmake --build build --config Release --parallel 8

      # 👇 收集所有依赖，一次性打进 dist\
      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          # llama.cpp 编译产物
          $bins = @(
            "llama-server.exe","llama-cli.exe","llama-bench.exe",
            "llama-gguf.exe","llama-quantize.exe","llama-perplexity.exe"
          )
          foreach ($bin in $bins) {
            $src = "build\bin\Release\$bin"
            if (Test-Path $src) { Copy-Item $src -Destination dist\ }
          }
          Copy-Item "build\bin\Release\*.dll" -Destination dist\

          # CUDA 12.9.1 运行时 DLL
          $cudaBin = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.9\bin"
          $cudaDlls = @(
            "cudart64_12.dll","cublas64_12.dll","cublasLt64_12.dll",
            "cufft64_11.dll","curand64_10.dll","cusolver64_11.dll",
            "cusparse64_12.dll","nvrtc64_12.dll"
          )
          foreach ($dll in $cudaDlls) {
            $src = Join-Path $cudaBin $dll
            if (Test-Path $src) {
              Copy-Item $src -Destination dist\
              Write-Host "✅ $dll"
            } else {
              Write-Warning "⚠️ Missing: $dll"
            }
          }

          # OpenSSL 3 DLL
          $sslDir = "C:\OpenSSL-Win64\bin"
          if ((Test-Path "$sslDir\libssl-3-x64.dll") -and (Test-Path "$sslDir\libcrypto-3-x64.dll")) {
            Copy-Item "$sslDir\libssl-3-x64.dll" -Destination dist\
            Copy-Item "$sslDir\libcrypto-3-x64.dll" -Destination dist\
            Write-Host "✅ OpenSSL 3 DLLs copied from $sslDir"
          } else {
            Write-Error "❌ OpenSSL 3 DLLs not found in $sslDir"
            exit 1
          }

          # 列出 dist 目录完整内容
          Write-Host "`n=== dist contents ==="
          Get-ChildItem dist | Select-Object Name, @{N='SizeKB';E={[int]($_.Length/1KB)}} | Format-Table -AutoSize

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-windows-cuda-arch${{ github.event.inputs.cuda_arch }}
          path: dist\
          retention-days: 30
