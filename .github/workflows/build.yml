name: Build llama.cpp Windows CUDA

on:
  workflow_dispatch:
    inputs:
      cuda_arch:
        description: 'CUDA 架构 (RTX 5060 Ti = 120, RTX 4090 = 89, RTX 3090 = 86)'
        required: false
        default: '120'
      llama_cpp_ref:
        description: 'llama.cpp 分支/tag/commit'
        required: false
        default: 'master'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows-cuda:
    runs-on: windows-2022
    steps:
      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ github.event.inputs.llama_cpp_ref }}
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Cache CUDA Toolkit
        uses: actions/cache@v4
        id: cache-cuda
        with:
          path: C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.9
          key: cuda-12.9.1-windows2022-${{ runner.os }}
          restore-keys: |
            cuda-12.9.1-windows2022-

      - name: Setup CUDA Toolkit
        if: steps.cache-cuda.outputs.cache-hit != 'true'
        uses: mjun0812/setup-cuda@v1
        with:
          version: '12.9.1'
          method: 'local'

      # 👇 OpenSSL 3 Light MSI（带 fallback 到完整版 EXE）
      - name: Install OpenSSL 3 (Light MSI)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $msiUrl = "https://slproweb.com/download/Win64OpenSSL_Light-3_5_2.msi"
          $msiPath = "Win64OpenSSL-Light.msi"
          
          try {
            Write-Host "Trying MSI: $msiUrl"
            Invoke-WebRequest -OutFile $msiPath $msiUrl -UseBasicParsing -TimeoutSec 60
            Write-Host "✅ MSI downloaded"
          }
          catch {
            Write-Warning "MSI download failed: $_"
            $exeUrl = "https://slproweb.com/download/Win64OpenSSL-3_5_2.exe"
            Write-Host "Trying fallback EXE: $exeUrl"
            Invoke-WebRequest -OutFile "Win64OpenSSL.exe" $exeUrl -UseBasicParsing -TimeoutSec 60
            Write-Host "✅ EXE downloaded"
            Start-Process -FilePath ".\Win64OpenSSL.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-","/DIR=C:\OpenSSL-Win64" -Wait
          }
          
          if (Test-Path $msiPath) {
            Write-Host "Installing via msiexec..."
            Start-Process -FilePath "msiexec.exe" -ArgumentList "/i","$msiPath","/quiet","/norestart","INSTALLDIR=C:\OpenSSL-Win64" -Wait
          }
          
          $sslDir = "C:\OpenSSL-Win64\bin"
          if (-not ((Test-Path "$sslDir\libssl-3-x64.dll") -and (Test-Path "$sslDir\libcrypto-3-x64.dll"))) {
            $defaultDir = "C:\Program Files\OpenSSL-Win64\bin"
            if (Test-Path "$defaultDir\libssl-3-x64.dll") {
              if (-not (Test-Path $sslDir)) { New-Item -ItemType Directory -Path $sslDir -Force | Out-Null }
              Copy-Item "$defaultDir\libssl-3-x64.dll" -Destination $sslDir
              Copy-Item "$defaultDir\libcrypto-3-x64.dll" -Destination $sslDir
            }
            else {
              Write-Error "❌ OpenSSL DLLs not found after installation"
              exit 1
            }
          }
          Write-Host "✅ OpenSSL 3 DLLs ready in $sslDir"

      - name: Cache build directory
        uses: actions/cache@v4
        id: cache-build
        with:
          path: build
          key: build-${{ github.event.inputs.llama_cpp_ref }}-cuda${{ github.event.inputs.cuda_arch }}-${{ runner.os }}-${{ hashFiles('llama.cpp/CMakeLists.txt', 'llama.cpp/ggml/src/ggml-cuda/CMakeLists.txt') }}
          restore-keys: |
            build-${{ github.event.inputs.llama_cpp_ref }}-cuda${{ github.event.inputs.cuda_arch }}-${{ runner.os }}-

      - name: Fix CUDA VS Integration
        shell: pwsh
        run: |
          $cudaPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.9"
          $vsBuildCustomizations = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Microsoft\VC\v170\BuildCustomizations"
          Copy-Item "$cudaPath\extras\visual_studio_integration\MSBuildExtensions\*" -Destination $vsBuildCustomizations -Force

      - name: CMake configure
        shell: cmd
        run: |
          cmake -B build ^
            -G "Visual Studio 17 2022" ^
            -A x64 ^
            -DGGML_CUDA=ON ^
            -DCMAKE_CUDA_ARCHITECTURES=${{ github.event.inputs.cuda_arch }} ^
            -DCMAKE_CUDA_COMPILER="C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.9\bin\nvcc.exe" ^
            -DCMAKE_GENERATOR_TOOLSET="cuda=C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.9" ^
            -DCUDA_TOOLKIT_ROOT_DIR="C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.9" ^
            -DLLAMA_BUILD_SERVER=ON ^
            -DLLAMA_BUILD_EXAMPLES=ON ^
            -DLLAMA_BUILD_TESTS=OFF ^
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: cmd
        run: |
          cmake --build build --config Release --parallel 8

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $bins = @("llama-server.exe","llama-cli.exe","llama-bench.exe","llama-gguf.exe","llama-quantize.exe","llama-perplexity.exe")
          foreach ($bin in $bins) {
            $src = "build\bin\Release\$bin"
            if (Test-Path $src) { Copy-Item $src -Destination dist\ }
          }
          Copy-Item "build\bin\Release\*.dll" -Destination dist\

          $cudaBin = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.9\bin"
          $cudaDlls = @("cudart64_12.dll","cublas64_12.dll","cublasLt64_12.dll","cufft64_11.dll","curand64_10.dll","cusolver64_11.dll","cusparse64_12.dll","nvrtc64_12.dll")
          foreach ($dll in $cudaDlls) {
            $src = Join-Path $cudaBin $dll
            if (Test-Path $src) { Copy-Item $src -Destination dist\ }
          }

          $sslDir = "C:\OpenSSL-Win64\bin"
          if ((Test-Path "$sslDir\libssl-3-x64.dll") -and (Test-Path "$sslDir\libcrypto-3-x64.dll")) {
            Copy-Item "$sslDir\libssl-3-x64.dll" -Destination dist\
            Copy-Item "$sslDir\libcrypto-3-x64.dll" -Destination dist\
            Write-Host "✅ OpenSSL 3 DLLs copied to dist\"
          }
          else {
            Write-Error "❌ OpenSSL 3 DLLs not found in $sslDir"
            exit 1
          }

          Write-Host "`n=== dist contents ==="
          Get-ChildItem dist | Select-Object Name | Format-Table -AutoSize

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-windows-cuda-arch${{ github.event.inputs.cuda_arch }}
          path: dist\
          retention-days: 30
