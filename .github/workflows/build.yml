name: Build llama.cpp Windows CUDA

on:
  workflow_dispatch:
    inputs:
      cuda_arch:
        description: 'CUDA 架构 (RTX 5060 Ti = 120, RTX 4090 = 89, RTX 3090 = 86)'
        required: false
        default: '120'
      llama_cpp_ref:
        description: 'llama.cpp 分支/tag/commit (默认 master)'
        required: false
        default: 'master'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows-cuda:
    runs-on: windows-2022
    steps:
      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ github.event.inputs.llama_cpp_ref }}
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # 👇 新增：缓存 CUDA 安装目录
      - name: Cache CUDA Toolkit
        uses: actions/cache@v4
        id: cache-cuda
        with:
          path: C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.9
          key: cuda-12.9.1-windows2022-${{ runner.os }}
          restore-keys: |
            cuda-12.9.1-windows2022-

      # 👇 只有缓存未命中时才安装 CUDA
      - name: Setup CUDA Toolkit
        if: steps.cache-cuda.outputs.cache-hit != 'true'
        uses: mjun0812/setup-cuda@v1
        with:
          version: '12.9.1'
          method: 'local'

      - name: Fix CUDA VS Integration
        shell: pwsh
        run: |
          $cudaPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.9"
          $vsBuildCustomizations = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Microsoft\VC\v170\BuildCustomizations"
          
          Write-Host "Copying CUDA MSBuild extensions to VS2022..."
          Copy-Item "$cudaPath\extras\visual_studio_integration\MSBuildExtensions\*" `
            -Destination $vsBuildCustomizations -Force
          
          # 验证复制结果
          Get-ChildItem $vsBuildCustomizations -Filter "CUDA*" | Select-Object Name

      - name: Verify environment
        shell: cmd
        run: |
          echo === nvcc ===
          nvcc --version
          echo === CUDA_PATH ===
          echo %CUDA_PATH%
          echo === cache hit ===
          echo %CACHE_HIT%
        env:
          CACHE_HIT: ${{ steps.cache-cuda.outputs.cache-hit }}

      - name: CMake configure
        shell: cmd
        run: |
          cmake -B build ^
            -G "Visual Studio 17 2022" ^
            -A x64 ^
            -DGGML_CUDA=ON ^
            -DCMAKE_CUDA_ARCHITECTURES=${{ github.event.inputs.cuda_arch }} ^
            -DCMAKE_CUDA_COMPILER="C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.9\bin\nvcc.exe" ^
            -DCMAKE_GENERATOR_TOOLSET="cuda=C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.9" ^
            -DCUDA_TOOLKIT_ROOT_DIR="C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.9" ^
            -DLLAMA_BUILD_SERVER=ON ^
            -DLLAMA_BUILD_EXAMPLES=ON ^
            -DLLAMA_BUILD_TESTS=OFF ^
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: cmd
        run: |
          cmake --build build --config Release --parallel 8

      - name: Collect artifacts
        shell: cmd
        run: |
          mkdir dist
          copy build\bin\Release\llama-server.exe dist\
          copy build\bin\Release\llama-cli.exe dist\
          copy build\bin\Release\llama-bench.exe dist\
          copy build\bin\Release\llama-gguf.exe dist\
          copy build\bin\Release\llama-quantize.exe dist\
          copy build\bin\Release\llama-perplexity.exe dist\
          copy build\bin\Release\*.dll dist\

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-windows-cuda-arch${{ github.event.inputs.cuda_arch }}
          path: dist\
          retention-days: 30
